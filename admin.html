<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Radio CECAP</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: #fff; padding: 20px; }
        .admin-container { max-width: 600px; margin: auto; background: #2d2d2d; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { color: #00d2ff; text-align: center; border-bottom: 2px solid #444; padding-bottom: 10px; }
        h3 { color: #ffeb3b; margin-bottom: 10px; }
        .card { background: #3d3d3d; padding: 20px; margin-bottom: 20px; border-radius: 10px; }
        /* Se agregó 'select' a esta regla para que luzca igual que los campos de texto */
        input[type="text"], input[type="file"], select { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; border-radius: 6px; border: none; background: #555; color: white; font-size: 14px; }
        button { background: #00d2ff; color: #000; border: none; padding: 12px 20px; cursor: pointer; border-radius: 6px; font-weight: bold; width: 100%; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #0099cc; }
        button.danger { background: #ff4444; color: white; margin-top: 5px; }
        button.danger:hover { background: #cc0000; }
        .song-item { display: flex; justify-content: space-between; align-items: center; background: #555; padding: 10px 15px; margin-top: 8px; border-radius: 8px; }
        .volver { background: #777; color: white; }
    </style>
</head>
<body>
    <div class="admin-container">
        <h2>⚙️ Panel de Control</h2>

        <div class="card">
            <h3>👥 Oyentes Activos</h3>
            <p style="font-size: 14px; color: #ccc;">Si la transmisión terminó pero el contador sigue marcando gente, bórralo aquí:</p>
            <button class="danger" onclick="limpiarOyentes()">🧹 Resetear Contador a 0</button>
        </div>

        <div class="card">
            <h3>🎵 Subir al AutoDJ</h3>
            <input type="text" id="titulo" placeholder="Título de la canción">
            <input type="text" id="artista" placeholder="Artista">
            <input type="file" id="archivoAudio" accept="audio/mpeg, audio/mp3">
            <button onclick="subirCancion()" id="btnSubir">⬆️ Subir y Guardar</button>
            <p id="estadoSubida" style="color: #00d2ff; font-size: 14px; display: none; text-align: center; margin-top: 10px;">Subiendo a la nube... por favor espera ⏳</p>
        </div>

        <div class="card">
            <h3>📅 Gestionar Grilla</h3>
            
            <label style="font-size: 14px; color: #ccc; font-weight: bold;">Día de la semana:</label>
            <select id="diaProg">
                <option value="Lunes" data-orden="1">Lunes</option>
                <option value="Martes" data-orden="2">Martes</option>
                <option value="Miércoles" data-orden="3">Miércoles</option>
                <option value="Jueves" data-orden="4">Jueves</option>
                <option value="Viernes" data-orden="5">Viernes</option>
                <option value="Sábado" data-orden="6">Sábado</option>
                <option value="Domingo" data-orden="7">Domingo</option>
            </select>
            
            <label style="font-size: 14px; color: #ccc; font-weight: bold;">Horario del programa:</label>
            <input type="text" id="horarioProg" placeholder="Ej: 14:00 a 16:00">
            
            <label style="font-size: 14px; color: #ccc; font-weight: bold;">Nombre del Programa o Locutor:</label>
            <input type="text" id="nombreProg" placeholder="Ej: Voces de la Comunidad">
            
            <button onclick="agregarPrograma()" style="background: #4CAF50; color: white;">➕ Agregar a la Grilla</button>

            <h4 style="margin-top: 25px; margin-bottom: 10px; border-bottom: 1px solid #555; padding-bottom: 5px; color: #00d2ff;">📋 Programas en cartelera:</h4>
            <ul id="adminListaGrilla" style="list-style: none; padding: 0; margin: 0;">
                </ul>
        </div>

        <div class="card">
            <h3>📋 Playlist de Emergencia</h3>
            <div id="listaCanciones">Cargando canciones...</div>
        </div>

        <button class="volver" onclick="window.location.href='index.html'">⬅️ Volver a la Radio</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCs4PnCfDpGvEP5kKbIFe6H-QgF1HVAtWE",
            authDomain: "roboclass-b929a.firebaseapp.com",
            projectId: "roboclass-b929a",
            storageBucket: "roboclass-b929a.firebasestorage.app",
            messagingSenderId: "719167351070",
            appId: "1:719167351070:web:3d5df1e151eed11748810f"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        // 1. FUNCIÓN PARA BORRAR OYENTES FANTASMAS
        async function limpiarOyentes() {
            const snapshot = await db.collection("oyentes_activos").get();
            const batch = db.batch();
            snapshot.docs.forEach(doc => {
                batch.delete(doc.ref);
            });
            await batch.commit();
            alert("✅ Contador reseteado a 0.");
        }

        // 2. FUNCIÓN PARA SUBIR MP3
        async function subirCancion() {
            const titulo = document.getElementById('titulo').value;
            const artista = document.getElementById('artista').value;
            const archivo = document.getElementById('archivoAudio').files[0];
            const btn = document.getElementById('btnSubir');
            const estado = document.getElementById('estadoSubida');

            if (!titulo || !artista || !archivo) {
                alert("Completa todos los campos y selecciona un MP3.");
                return;
            }

            btn.disabled = true;
            estado.style.display = "block";

            try {
                const storageRef = storage.ref('autodj/' + archivo.name);
                await storageRef.put(archivo);
                const url = await storageRef.getDownloadURL();

                await db.collection("playlist_emergencia").add({
                    titulo: titulo,
                    artista: artista,
                    url_audio: url,
                    activa: true,
                    orden: Date.now() 
                });

                alert("✅ Canción subida con éxito");
                document.getElementById('titulo').value = "";
                document.getElementById('artista').value = "";
                document.getElementById('archivoAudio').value = "";
            } catch (error) {
                alert("❌ Error al subir: " + error.message);
            } finally {
                btn.disabled = false;
                estado.style.display = "none";
            }
        }

        // 3. MOSTRAR PLAYLIST DE EMERGENCIA
        db.collection("playlist_emergencia").orderBy("orden").onSnapshot((snapshot) => {
            const lista = document.getElementById('listaCanciones');
            lista.innerHTML = "";
            if (snapshot.empty) {
                lista.innerHTML = "<p style='color: #aaa;'>No hay canciones cargadas.</p>";
                return;
            }
            snapshot.forEach(doc => {
                const data = doc.data();
                lista.innerHTML += `
                    <div class="song-item">
                        <span style="font-size: 14px;">🎵 ${data.titulo} - ${data.artista}</span>
                        <button class="danger" style="width: auto; margin: 0; padding: 6px 12px;" onclick="borrarCancion('${doc.id}')">Eliminar</button>
                    </div>
                `;
            });
        });

        // 4. BORRAR CANCIÓN DE LA LISTA
        async function borrarCancion(id) {
            if(confirm("¿Quitar esta canción del AutoDJ?")) {
                await db.collection("playlist_emergencia").doc(id).delete();
            }
        }

        // 5. AGREGAR PROGRAMA A LA GRILLA
        function agregarPrograma() {
            const selectDia = document.getElementById("diaProg");
            const dia = selectDia.value;
            const orden = parseInt(selectDia.options[selectDia.selectedIndex].getAttribute("data-orden"));
            const horario = document.getElementById("horarioProg").value;
            const nombre = document.getElementById("nombreProg").value;
            
            if(!horario || !nombre) {
                alert("⚠️ Por favor, completa el horario y el nombre del programa.");
                return;
            }
            
            db.collection("programacion").add({
                dia: dia,
                ordenDia: orden,
                horario: horario,
                nombre: nombre
            }).then(() => {
                document.getElementById("horarioProg").value = "";
                document.getElementById("nombreProg").value = "";
            });
        }

        // 6. BORRAR PROGRAMA DE LA GRILLA
        function borrarPrograma(id) {
            if(confirm("¿Seguro que quieres borrar este programa de la grilla?")) {
                db.collection("programacion").doc(id).delete();
            }
        }

        // 7. MOSTRAR LISTA DE PROGRAMAS EN EL ADMIN
        db.collection("programacion").orderBy("ordenDia").orderBy("horario").onSnapshot((snap) => {
            const adminLista = document.getElementById('adminListaGrilla');
            adminLista.innerHTML = '';
            if (snap.empty) {
                adminLista.innerHTML = "<p style='color: #aaa; font-size: 14px;'>No hay programas configurados.</p>";
                return;
            }
            snap.forEach(doc => {
                const p = doc.data();
                adminLista.innerHTML += `
                    <li class="song-item">
                        <span style="font-size: 14px;"><strong>${p.dia} (${p.horario}):</strong> ${p.nombre}</span>
                        <button class="danger" style="width: auto; margin: 0; padding: 6px 12px;" onclick="borrarPrograma('${doc.id}')">❌ Borrar</button>
                    </li>
                `;
            });
        });
    </script>
</body>
</html>
