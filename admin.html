<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Radio CECAP</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: #fff; padding: 20px; }
        .admin-container { max-width: 600px; margin: auto; background: #2d2d2d; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { color: #00d2ff; text-align: center; border-bottom: 2px solid #444; padding-bottom: 10px; }
        h3 { color: #ffeb3b; margin-bottom: 10px; }
        .card { background: #3d3d3d; padding: 20px; margin-bottom: 20px; border-radius: 10px; }
        input[type="text"], input[type="file"], input[type="number"] { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; border-radius: 6px; border: none; background: #555; color: white; font-size: 14px; }
        button { background: #00d2ff; color: #000; border: none; padding: 12px 20px; cursor: pointer; border-radius: 6px; font-weight: bold; width: 100%; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #0099cc; }
        button.danger { background: #ff4444; color: white; margin-top: 5px; }
        button.danger:hover { background: #cc0000; }
        .song-item { display: flex; justify-content: space-between; align-items: center; background: #555; padding: 10px 15px; margin-top: 8px; border-radius: 8px; gap: 10px; }
        .volver { background: #777; color: white; }
        
        .input-grilla { background: white !important; color: black !important; border: 2px solid #00d2ff !important; font-weight: 500 !important; }
        .input-grilla::placeholder { color: #666 !important; }
        .acciones-item { display: flex; gap: 5px; }
    </style>
</head>
<body>
    <div class="admin-container">
        <h2>⚙️ Panel de Control</h2>

        <div class="card">
            <h3>👥 Oyentes Activos</h3>
            <button class="danger" onclick="limpiarOyentes()">🧹 Resetear Contador a 0</button>
        </div>

        <div class="card">
            <h3>🎵 Subir al AutoDJ</h3>
            <input type="text" id="titulo" placeholder="Título de la canción">
            <input type="text" id="artista" placeholder="Artista">
            <input type="file" id="archivoAudio" accept="audio/mpeg, audio/mp3">
            <button onclick="subirCancion()" id="btnSubir">⬆️ Subir y Guardar</button>
            <p id="estadoSubida" style="color: #00d2ff; font-size: 14px; display: none; text-align: center; margin-top: 10px;">Subiendo a la nube... por favor espera ⏳</p>
        </div>

        <!-- NUEVO GESTOR DE CARTELERA (TARJETAS LIBRES) -->
        <div class="card">
            <h3>📅 Gestionar Cartelera</h3>
            
            <label style="font-size: 14px; color: #ffeb3b; font-weight: bold; display: block; margin-top: 10px;">1. Orden (El 1 va primero):</label>
            <input type="number" id="ordenProg" class="input-grilla" value="1" min="1" style="width: 100px;">
            
            <label style="font-size: 14px; color: #ffeb3b; font-weight: bold; display: block; margin-top: 10px;">2. Nombre del Programa:</label>
            <input type="text" id="nombreProg" class="input-grilla" placeholder="Ej: Proyecto de robótica">
            
            <label style="font-size: 14px; color: #ffeb3b; font-weight: bold; display: block; margin-top: 10px;">3. Frecuencia y Horario (Texto libre):</label>
            <input type="text" id="horarioProg" class="input-grilla" placeholder="Ej: De lunes a viernes de 8:00 a 9:30">
            
            <div style="display: flex; gap: 10px;">
                <button id="btnGuardarProg" onclick="guardarPrograma()" style="background: #4CAF50; color: white; margin-top: 15px;">➕ Guardar Tarjeta</button>
                <button id="btnCancelarEdicion" onclick="cancelarEdicion()" style="background: #777; color: white; margin-top: 15px; display: none; width: auto;">❌ Cancelar</button>
            </div>

            <h4 style="margin-top: 25px; margin-bottom: 10px; border-bottom: 1px solid #555; padding-bottom: 5px; color: #00d2ff;">📋 Tarjetas actuales:</h4>
            <ul id="adminListaGrilla" style="list-style: none; padding: 0; margin: 0;"></ul>
        </div>

        <div class="card">
            <h3>📋 Playlist de Emergencia</h3>
            <div id="listaCanciones">Cargando canciones...</div>
        </div>

        <button class="volver" onclick="window.location.href='index.html'">⬅️ Volver a la Radio</button>
    </div>

    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCs4PnCfDpGvEP5kKbIFe6H-QgF1HVAtWE",
            authDomain: "roboclass-b929a.firebaseapp.com",
            projectId: "roboclass-b929a",
            storageBucket: "roboclass-b929a.firebasestorage.app",
            messagingSenderId: "719167351070",
            appId: "1:719167351070:web:3d5df1e151eed11748810f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        async function limpiarOyentes() {
            const snapshot = await db.collection("oyentes_activos").get();
            const batch = db.batch();
            snapshot.docs.forEach(doc => batch.delete(doc.ref));
            await batch.commit();
            alert("✅ Contador reseteado a 0.");
        }

        async function subirCancion() {
            const titulo = document.getElementById('titulo').value;
            const artista = document.getElementById('artista').value;
            const archivo = document.getElementById('archivoAudio').files[0];
            const btn = document.getElementById('btnSubir');
            const estado = document.getElementById('estadoSubida');

            if (!titulo || !artista || !archivo) return alert("Completa todos los campos y selecciona un MP3.");
            btn.disabled = true; estado.style.display = "block";

            try {
                const storageRef = storage.ref('autodj/' + archivo.name);
                await storageRef.put(archivo);
                const url = await storageRef.getDownloadURL();

                await db.collection("playlist_emergencia").add({ titulo, artista, url_audio: url, activa: true, orden: Date.now() });
                alert("✅ Canción subida con éxito");
                document.getElementById('titulo').value = ""; document.getElementById('artista').value = ""; document.getElementById('archivoAudio').value = "";
            } catch (error) { alert("❌ Error al subir: " + error.message); } 
            finally { btn.disabled = false; estado.style.display = "none"; }
        }

        db.collection("playlist_emergencia").orderBy("orden").onSnapshot((snapshot) => {
            const lista = document.getElementById('listaCanciones');
            lista.innerHTML = "";
            if (snapshot.empty) return lista.innerHTML = "<p style='color: #aaa;'>No hay canciones cargadas.</p>";
            snapshot.forEach(doc => {
                const data = doc.data();
                lista.innerHTML += `<div class="song-item"><span style="font-size: 14px;">🎵 ${data.titulo} - ${data.artista}</span><button class="danger" style="width: auto; margin: 0; padding: 6px 12px;" onclick="borrarCancion('${doc.id}')">Eliminar</button></div>`;
            });
        });

        async function borrarCancion(id) {
            if(confirm("¿Quitar esta canción del AutoDJ?")) await db.collection("playlist_emergencia").doc(id).delete();
        }

        let programaEditandoId = null;

        function guardarPrograma() {
            const orden = parseInt(document.getElementById("ordenProg").value) || 99;
            const nombre = document.getElementById("nombreProg").value;
            const horario = document.getElementById("horarioProg").value;
            
            if(!horario || !nombre) {
                alert("⚠️ Por favor, completa el nombre y el horario.");
                return;
            }

            const datos = { orden: orden, nombre: nombre, horario: horario };
            
            if (programaEditandoId) {
                db.collection("programacion").doc(programaEditandoId).update(datos).then(() => cancelarEdicion());
            } else {
                db.collection("programacion").add(datos).then(() => {
                    document.getElementById("nombreProg").value = "";
                    document.getElementById("horarioProg").value = "";
                    document.getElementById("ordenProg").value = (orden + 1); // Suma 1 automático para el siguiente
                });
            }
        }

        function cargarParaEditar(id, orden, nombre, horario) {
            document.getElementById("ordenProg").value = orden;
            document.getElementById("nombreProg").value = nombre;
            document.getElementById("horarioProg").value = horario;
            programaEditandoId = id;
            
            const btnGuardar = document.getElementById("btnGuardarProg");
            btnGuardar.innerHTML = "💾 Guardar Cambios";
            btnGuardar.style.background = "#ff9800";
            document.getElementById("btnCancelarEdicion").style.display = "block";
            document.getElementById("ordenProg").scrollIntoView({ behavior: 'smooth' });
        }

        function cancelarEdicion() {
            programaEditandoId = null;
            document.getElementById("nombreProg").value = "";
            document.getElementById("horarioProg").value = "";
            
            const btnGuardar = document.getElementById("btnGuardarProg");
            btnGuardar.innerHTML = "➕ Guardar Tarjeta";
            btnGuardar.style.background = "#4CAF50";
            document.getElementById("btnCancelarEdicion").style.display = "none";
        }

        function borrarPrograma(id) {
            if(confirm("¿Borrar esta tarjeta de la cartelera?")) {
                db.collection("programacion").doc(id).delete();
                if (programaEditandoId === id) cancelarEdicion();
            }
        }

        db.collection("programacion").onSnapshot((snap) => {
            const adminLista = document.getElementById('adminListaGrilla');
            adminLista.innerHTML = '';
            let programas = [];
            snap.forEach(doc => { let data = doc.data(); data.id = doc.id; programas.push(data); });
            
            programas.sort((a, b) => (a.orden || 99) - (b.orden || 99));

            programas.forEach(p => {
                adminLista.innerHTML += `
                    <li class="song-item">
                        <span style="font-size: 14px; flex: 1;"><strong>[#${p.orden}]</strong> ${p.nombre} <br><span style="color:#00d2ff; font-size:12px;">${p.horario}</span></span>
                        <div class="acciones-item">
                            <button style="background: #ff9800; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 3px; font-weight: bold; width: auto; margin: 0;" onclick="cargarParaEditar('${p.id}', ${p.orden}, '${p.nombre}', '${p.horario}')">✏️</button>
                            <button class="danger" style="width: auto; margin: 0; padding: 6px 12px;" onclick="borrarPrograma('${p.id}')">❌</button>
                        </div>
                    </li>
                `;
            });
        });
    </script>
</body>
</html>
