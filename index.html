<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio CECAP Rivera</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* --- CORRECCIÓN CRÍTICA DE SCROLL (DESBLOQUEO DE PANTALLA) --- */
        html, body {
            overflow-y: auto !important;  /* Forza a que aparezca el scroll vertical */
            height: auto !important;      /* Quita la altura rígida fija */
            min-height: 100vh;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .player-container {
            height: auto !important;      /* Permite que el contenedor crezca con la grilla */
            max-height: none !important;  /* Elimina cualquier tope de altura */
            margin: 20px auto !important; /* Centra el reproductor y le da aire arriba y abajo */
            padding-bottom: 40px !important; /* Espacio extra al final para que respire el scroll */
        }

        /* --- AJUSTE PARA EL NUEVO ESLOGAN EN UNA SOLA LÍNEA --- */
        h1 {
            font-size: 20px !important;      /* Tamaño ajustado para celulares */
            white-space: nowrap !important;  /* Prohíbe terminantemente el salto de línea */
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;         /* Agrega "..." si la pantalla es ridículamente estrecha */
            margin-top: 15px;
            margin-bottom: 5px;
        }

        /* Ajuste para el QR */
        .qr-section {
            margin-top: 30px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .qr-section img {
            width: 100px;
            height: 100px;
            border: 3px solid white;
            border-radius: 10px;
        }
        .qr-text {
            font-size: 14px;
            text-align: left;
            line-height: 1.2;
            color: white;
            font-weight: bold;
        }

        /* Estilos para la Grilla de Programación */
        .grilla-section {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            text-align: left;
            color: white;
        }
        .grilla-section h3 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 18px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 10px;
        }
        .grilla-lista {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .grilla-lista li {
            background: rgba(255, 255, 255, 0.1);
            margin-bottom: 8px;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .grilla-dia-hora {
            font-weight: bold;
            color: #4CAF50;
        }
    </style>
</head>
<body>
    <div class="player-container">
        <img src="LogoRadio.jpeg" alt="Logo CECAP" id="logoRadio" 
             style="width: 150px; border-radius: 50%; cursor: pointer; border: 3px solid white;" 
             onclick="accesoAdmin()">
        
        <h1>Informando y conectando</h1>
        <p id="subtitulo">Haz clic en ▶️ Escuchar para conectar</p>

        <div class="visualizer" id="visualizer">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div>
        </div>

        <audio id="radioStream" src="https://giss.tv:667/cecap.mp3" preload="none"></audio>

        <button id="playBtn">▶️ Escuchar</button>

        <div id="contadorContenedor" style="margin-top: 15px; font-size: 14px; color: #fff; font-weight: bold;">
            👁️ <span id="numOyentes">0</span> oyentes en línea
        </div>

        <div class="volume-container">
            <span>🔈</span>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.5">
            <span>🔊</span>
        </div>

        <div class="qr-section">
            <img src="QR-Radio.png" alt="Escanéame">
            <div class="qr-text">
                ¡ESCANEA Y<br>COMPARTE LA<br>RADIO DE CECAP!
            </div>
        </div>

        <div class="grilla-section">
            <h3>📅 Programación de la Semana</h3>
            <ul class="grilla-lista" id="listaGrilla">
                <li>Cargando programación...</li>
            </ul>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        function accesoAdmin() {
            const claveCorrecta = "cecap2026"; 
            const intento = prompt("🔒 Área restringida. Ingresa la contraseña:");
            if (intento === claveCorrecta) window.location.href = "admin.html";
            else if (intento !== null) alert("❌ Acceso denegado.");
        }

        const audio = document.getElementById('radioStream');
        const playBtn = document.getElementById('playBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const visualizer = document.getElementById('visualizer');
        const tituloRadio = document.querySelector('h1');
        const subtituloRadio = document.getElementById('subtitulo');
        const numOyentesElemento = document.getElementById('numOyentes');

        const firebaseConfig = {
            apiKey: "AIzaSyCs4PnCfDpGvEP5kKbIFe6H-QgF1HVAtWE",
            authDomain: "roboclass-b929a.firebaseapp.com",
            projectId: "roboclass-b929a",
            storageBucket: "roboclass-b929a.firebasestorage.app",
            messagingSenderId: "719167351070",
            appId: "1:719167351070:web:3d5df1e151eed11748810f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- SISTEMA AUTODJ ALEATORIO ---
        let playlist = [];
        let cancionActualIndex = -1;
        let autoDjActivo = false;

        db.collection("playlist_emergencia").where("activa", "==", true).onSnapshot((snap) => {
            playlist = [];
            snap.forEach((doc) => playlist.push(doc.data()));
        });

        function reproducirAleatoria() {
            if (playlist.length === 0) {
                tituloRadio.innerText = "Radio Fuera de Línea";
                subtituloRadio.innerText = "No hay canciones de emergencia disponibles.";
                return;
            }

            let nuevoIndex;
            if (playlist.length > 1) {
                do {
                    nuevoIndex = Math.floor(Math.random() * playlist.length);
                } while (nuevoIndex === cancionActualIndex);
            } else {
                nuevoIndex = 0;
            }

            cancionActualIndex = nuevoIndex;
            const cancion = playlist[cancionActualIndex];
            
            audio.src = cancion.url_audio;
            audio.play().then(() => {
                autoDjActivo = true;
                playBtn.innerHTML = '⏸️ Pausar';
                visualizer.classList.add('active');
                tituloRadio.innerText = "AutoDJ Activado 🔀";
                subtituloRadio.innerText = "🎶 " + cancion.titulo + " - " + cancion.artista;
            }).catch(err => console.log("Error en AutoDJ:", err));
        }

        audio.addEventListener('ended', () => {
            if (autoDjActivo) {
                reproducirAleatoria();
            }
        });

        // --- CONTROL PRINCIPAL CON BYPASS RÁPIDO ---
        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                playBtn.innerHTML = '⏳ Conectando...';
                
                let testVivo = new Audio("https://giss.tv:667/cecap.mp3?nc=" + Date.now());
                testVivo.volume = 0;

                let timeoutBypass = setTimeout(() => {
                    testVivo.pause();
                    testVivo.src = "";
                    if(playlist.length > 0) reproducirAleatoria();
                }, 3000);

                testVivo.play().then(() => {
                    clearTimeout(timeoutBypass);
                    testVivo.pause();
                    testVivo.src = "";
                    
                    autoDjActivo = false;
                    audio.src = "https://giss.tv:667/cecap.mp3";
                    audio.play().then(() => {
                        playBtn.innerHTML = '⏸️ Pausar';
                        visualizer.classList.add('active');
                        tituloRadio.innerText = "Radio CECAP Rivera";
                        subtituloRadio.innerText = "🔴 Transmitiendo en vivo desde Rivera, Uruguay";
                    });
                }).catch(() => {
                    clearTimeout(timeoutBypass);
                    if(playlist.length > 0) reproducirAleatoria();
                });

            } else {
                audio.pause();
                playBtn.innerHTML = '▶️ Escuchar';
                visualizer.classList.remove('active');
                tituloRadio.innerText = "Radio CECAP Rivera";
                subtituloRadio.innerText = "Transmisión pausada";
            }
        });

        volumeSlider.addEventListener('input', (e) => audio.volume = e.target.value);

        // --- VERIFICADOR DE RETORNO DE SEÑAL GISS.TV ---
        setInterval(() => {
            if (autoDjActivo) {
                let test = new Audio("https://giss.tv:667/cecap.mp3?nc=" + Date.now());
                test.volume = 0;
                test.play().then(() => {
                    autoDjActivo = false;
                    test.pause();
                    audio.pause();
                    audio.src = "https://giss.tv:667/cecap.mp3";
                    audio.play();
                    playBtn.innerHTML = '⏸️ Pausar';
                    tituloRadio.innerText = "Radio CECAP Rivera";
                    subtituloRadio.innerText = "🔴 Transmitiendo en vivo desde Rivera, Uruguay";
                }).catch(() => console.log("Vivo offline, AutoDJ continúa..."));
            }
        }, 20000);

        // --- SISTEMA DE OYENTES MEJORADO ---
        async function gestionarOyente() {
            const ref = await db.collection("oyentes_activos").add({ t: Date.now() });
            window.addEventListener('beforeunload', () => ref.delete());
            window.addEventListener('pagehide', () => ref.delete());
            window.addEventListener('unload', () => ref.delete());
        }
        db.collection("oyentes_activos").onSnapshot(snap => numOyentesElemento.innerText = snap.size);
        gestionarOyente();

        // --- SISTEMA DE GRILLA DE PROGRAMACIÓN (CON ORDENAMIENTO JS) ---
        const listaGrilla = document.getElementById('listaGrilla');
        
        db.collection("programacion").onSnapshot((snap) => {
            listaGrilla.innerHTML = '';
            if (snap.empty) {
                listaGrilla.innerHTML = '<li>Aún no hay programas anunciados. ¡Próximamente!</li>';
                return;
            }
            
            let programas = [];
            snap.forEach((doc) => programas.push(doc.data()));
            
            programas.sort((a, b) => {
                if (a.ordenDia !== b.ordenDia) {
                    return a.ordenDia - b.ordenDia;
                }
                return a.horario.localeCompare(b.horario);
            });

            programas.forEach((prog) => {
                listaGrilla.innerHTML += `
                    <li>
                        <span class="grilla-dia-hora">${prog.dia} | ${prog.horario}</span>
                        <span>${prog.nombre}</span>
                    </li>
                `;
            });
        });
    </script>
</body>
</html>
